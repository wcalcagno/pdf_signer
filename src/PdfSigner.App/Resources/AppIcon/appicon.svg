<!--
    Capa de fondo del icono. Es un color plano a propósito: el fondo de un icono adaptativo
    de Android se desplaza y se recorta con formas distintas según el lanzador, así que
    cualquier detalle aquí acabaría descentrado o cortado.
-->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <rect width="456" height="456" fill="#1B2A6B" />
</svg>
