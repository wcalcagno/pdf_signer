<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    Capa frontal del icono: una hoja con una firma trazada encima.

    Todo el dibujo cabe dentro de un círculo de radio 150 centrado en el lienzo. No es
    estético sino necesario: los iconos adaptativos de Android recortan con formas variables
    (círculo, cuadrado redondeado, gota) y solo se garantiza visible la zona central.

    El dibujo es deliberadamente escaso. La primera versión tenía tres renglones y una firma
    de cuatro ondas: a 32 px se leía bien, pero a 16 —el tamaño de la barra de tareas, donde
    más se ve un icono— todo se fundía en una mancha gris. Dos renglones, dos ondas y trazos
    gruesos sobreviven al tamaño pequeño, que es la prueba que de verdad importa.
-->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Sombra suave, para despegar la hoja del fondo -->
  <rect x="140" y="120" width="184" height="228" rx="14" fill="#000000" opacity="0.20" />

  <!-- La hoja -->
  <rect x="136" y="114" width="184" height="228" rx="14" fill="#FFFFFF" />

  <!-- Dos renglones, gruesos. Tres se emborronaban en un solo píxel gris. -->
  <g fill="#BFC7DB">
    <rect x="164" y="148" width="128" height="17" rx="8.5" />
    <rect x="164" y="180" width="92"  height="17" rx="8.5" />
  </g>

  <!--
      La firma. Tres ondas de amplitud desigual y con deriva hacia la derecha, que es lo
      que distingue una rúbrica de un zigzag: las ondas idénticas y muy redondas parecían
      dos letras sueltas.

      El grosor es un compromiso medido: con 20 las curvas se empastaban en tamaño grande,
      con 13 desaparecían en tamaño pequeño.
  -->
  <path d="M 154 284
           C 168 234, 190 228, 200 270
           C 208 304, 220 308, 232 274
           C 241 248, 255 246, 263 270
           C 270 290, 285 290, 302 262"
        fill="none"
        stroke="#1B2A6B"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Rúbrica: el trazo que cruza por debajo y se prolonga a la derecha -->
  <path d="M 170 304 C 210 320, 264 314, 306 290"
        fill="none"
        stroke="#1B2A6B"
        stroke-width="12"
        stroke-linecap="round" />
</svg>
