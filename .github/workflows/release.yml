name: Paquetes

# Se puede lanzar a mano para comprobar que las cuatro plataformas siguen compilando,
# o automáticamente al publicar una etiqueta v*, que además adjunta los paquetes a la
# Release de GitHub.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:

  # --------------------------------------------------------------- Windows
  windows:
    name: Windows (MSI)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Instalar workloads de MAUI
        run: dotnet workload install maui --skip-manifest-update

      - name: Instalar WiX
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add --global WixToolset.UI.wixext/6.0.2

      # La version sale de la etiqueta. Con 1.0.0 escrito a fuego, una release v1.0.3
      # habria llevado dentro un instalador que dice ser 1.0.0.
      - name: Construir el MSI
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = '0.0.0' }
          Write-Output "Version del instalador: $version"
          .\installer\build-msi.ps1 -Version $version -Arch x64
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: dist/*.msi

  # --------------------------------------------------------------- Android
  android:
    name: Android (APK)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'

      # En Linux solo se puede instalar maui-android: el workload maui completo
      # incluye iOS, macCatalyst y Windows, y su instalacion falla en este runner.
      - name: Instalar workloads de MAUI
        run: dotnet workload install maui-android --skip-manifest-update

      # AndroidKeyStore=false firma con la clave de depuración. Es suficiente para
      # instalar el APK a mano, que es como se distribuye fuera de Play Store. Subir a
      # Play exige una clave propia, que iría en los secretos del repositorio.
      # Sin -o a proposito: con esa opcion el SDK resuelve el RID de la maquina
      # anfitriona (linux-x64) en vez del de Android y pide un runtime pack de Mono
      # que no existe, fallando con NU1102.
      - name: Publicar APK
        run: >
          dotnet publish src/PdfSigner.App/PdfSigner.App.csproj
          -f net10.0-android -c Release
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false
          -p:RuntimeIdentifier=android-arm64

      # Solo el APK firmado. La compilación deja también uno sin firmar, que Android se
      # niega a instalar: publicar los dos solo sirve para que alguien descargue el que
      # no funciona.
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: src/PdfSigner.App/bin/Release/net10.0-android/**/*-Signed.apk

  # ------------------------------------------------------------ macCatalyst
  mac:
    name: macOS (app)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # .NET para iOS va atado a una version exacta de Xcode y el runner suele traer una
      # mas nueva. Se lista lo disponible y se selecciona la compatible si esta presente.
      - name: Seleccionar Xcode compatible
        run: |
          ls /Applications | grep -i '^Xcode' || true
          # No basta con que la carpeta exista: en los runners hay instalaciones
          # parciales de Xcode sin el SDK de macOS, y al seleccionarlas el build
          # revienta mas tarde con "actool not found". Se comprueba el SDK antes.
          elegido=""
          for c in /Applications/Xcode_26.0.1.app /Applications/Xcode_26.0.app /Applications/Xcode.app; do
            if [ -d "$c/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              elegido="$c"
              break
            fi
          done
          if [ -z "$elegido" ]; then
            echo "No se encontro ningun Xcode con el SDK de macOS completo"; exit 1
          fi
          echo "Usando $elegido"
          sudo xcode-select -s "$elegido"
          xcodebuild -version

      - name: Instalar workloads de MAUI
        run: dotnet workload install maui --skip-manifest-update

      # Sin certificado de Apple no se puede firmar ni notarizar, así que se genera el
      # .app sin firmar. macOS lo bloqueará la primera vez: hay que abrirlo con clic
      # derecho > Abrir, o quitar la cuarentena con xattr. Viene explicado en el README.
      - name: Publicar la app de macCatalyst
        run: >
          dotnet publish src/PdfSigner.App/PdfSigner.App.csproj
          -f net10.0-maccatalyst -c Release
          -p:CreatePackage=false
          -p:EnableCodeSigning=false
          -p:RuntimeIdentifier=maccatalyst-x64

      # El .app no queda siempre en la raiz de la carpeta de salida, asi que se busca.
      # ditto conserva los metadatos del bundle mejor que zip.
      - name: Comprimir el .app
        run: |
          app=$(find src/PdfSigner.App/bin/Release/net10.0-maccatalyst -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "$app" ]; then
            echo "No se encontro ningun .app. Contenido generado:"
            find src/PdfSigner.App/bin/Release/net10.0-maccatalyst -maxdepth 3 | head -40
            exit 1
          fi
          echo "Empaquetando $app"
          ditto -c -k --keepParent "$app" PdfSigner-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: PdfSigner-macos.zip

  # ------------------------------------------------------------------- iOS
  # Solo se compila para comprobar que el código sigue siendo válido. No se genera IPA:
  # distribuir en iOS exige una cuenta de desarrollador de Apple de pago y perfiles de
  # aprovisionamiento, que no se pueden meter en un repositorio público.
  ios:
    name: iOS (solo compilación)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # La numeracion de .NET para iOS y la de Xcode NO se corresponden: el SDK 26.5 exige
      # Xcode 26.6. Y el runner no tiene runtime de simulador para 26.6, solo para 26.2,
      # 26.4 y 26.5. Por eso se compila para DISPOSITIVO mas abajo: un build de dispositivo
      # no necesita ningun runtime de simulador.
      #
      # Ademas no vale cualquier carpeta: /Applications/Xcode.app resulto no tener el SDK de
      # macOS, y sin el, actool no se puede localizar. Se comprueba antes de elegir.
      - name: Preparar Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          echo "--- cuales tienen el SDK de macOS ---"
          for c in /Applications/Xcode_26.6.app /Applications/Xcode_26.6.0.app /Applications/Xcode.app; do
            if [ -d "$c/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              echo "  OK  $c"
            else
              echo "  --  $c (sin SDK de macOS)"
            fi
          done

          elegido=""
          for c in /Applications/Xcode_26.6.app /Applications/Xcode_26.6.0.app /Applications/Xcode.app; do
            if [ -d "$c/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              elegido="$c"
              break
            fi
          done
          if [ -z "$elegido" ]; then
            echo "Ningun Xcode 26.6 con el SDK de macOS completo"; exit 1
          fi
          echo "Usando $elegido"
          sudo xcode-select -s "$elegido"
          xcodebuild -version

      - name: Instalar y actualizar workloads de MAUI
        run: |
          dotnet workload install maui --skip-manifest-update
          # La actualizacion trae el Microsoft.iOS.Sdk mas reciente, que es lo que puede
          # aceptar el Xcode del runner.
          dotnet workload update
          dotnet workload list

      # Para dispositivo y no para simulador: asi no hace falta ningun runtime de simulador,
      # que es lo que no tiene el runner para la version de Xcode que exige el SDK. La firma
      # va desactivada porque no hay cuenta de Apple; el objetivo es unicamente comprobar
      # que el codigo de iOS es valido.
      - name: Compilar para dispositivo
        run: >
          dotnet build src/PdfSigner.App/PdfSigner.App.csproj
          -f net10.0-ios -c Release
          -p:RuntimeIdentifier=ios-arm64
          -p:EnableCodeSigning=false
          -p:CodesignRequireProvisioningProfile=false

  # --------------------------------------------------------------- Release
  publicar:
    name: Adjuntar a la Release
    needs: [windows, android, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: paquetes

      # download/README.md promete estas sumas, asi que se generan de verdad.
      #
      # Se listan por NOMBRE DE ARCHIVO, no por ruta: los artefactos llegan dentro de
      # subcarpetas propias de la compilacion, y un usuario que descarga de la release ve
      # solo el nombre. Ademas algunos aparecen por partida doble (en bin y en publish),
      # de ahi el sort -u: la primera version del fichero listaba el mismo APK dos veces.
      - name: Calcular sumas de verificación
        run: |
          cd paquetes
          find . -type f ! -name 'SHA256SUMS.txt' | while read -r archivo; do
            printf '%s  %s\n' "$(sha256sum "$archivo" | cut -d' ' -f1)" "$(basename "$archivo")"
          done | sort -u > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: paquetes/**/*
          generate_release_notes: true
          body: |
            Aplicación libre para firmar PDFs colocando una imagen de firma y un bloque de
            texto sobre la página. Es firma **visual**, no criptográfica.

            ## Qué descargar

            | Sistema | Archivo | Nota |
            |---|---|---|
            | Windows 10/11 | `PdfSigner-*-win-x64.msi` | No pide permisos de administrador |
            | Android 5+ | `*-Signed.apk` | Hay que permitir orígenes desconocidos |
            | macOS 15+ | `PdfSigner-macos.zip` | Clic derecho → Abrir, la primera vez |
            | iOS | — | No distribuible sin cuenta de desarrollador de Apple |

            Ningún paquete está firmado digitalmente, así que los tres sistemas avisarán de
            editor desconocido. El porqué y las instrucciones detalladas están en
            [download/README.md](https://github.com/wcalcagno/pdf_signer/blob/main/download/README.md).

            `SHA256SUMS.txt` trae las sumas de verificación de todos los archivos.

            ## Estado por plataforma

            **Windows está probado**: se ha usado con documentos reales de principio a fin,
            incluido exportar. **Android y macOS compilan y se empaquetan, pero nadie los ha
            ejecutado todavía.** Si los pruebas, un issue contando qué pasó es la contribución
            más útil ahora mismo.
